<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking admin — Your Name</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f7f4}.admin{padding:70px 0}.admin-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.admin table{width:100%;border-collapse:collapse;background:#fff}.admin th,.admin td{padding:14px;text-align:left;border-bottom:1px solid #11202722;font:12px var(--mono)}.admin th{color:#607078;font-size:10px;text-transform:uppercase}.admin select{padding:7px;font:11px var(--mono)}.status-paid{color:#11836f}.status-pending_verification{color:#bd654d}.status-cancelled{color:#9b4652}.empty{padding:30px;color:#607078}</style></head><body><main class="shell admin"><div class="admin-head"><div><p class="kicker"><b>ADMIN</b> Booking review</p><h1>Payment verification</h1></div><a class="under" href="/">Back to site ↗</a></div><p id="message" class="intro">Use your admin token in the URL: <code>?token=YOUR_ADMIN_TOKEN</code></p><table><thead><tr><th>Time</th><th>Client</th><th>Service</th><th>Method</th><th>Transaction</th><th>Status</th><th>Calendar</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></main><script>const token=new URLSearchParams(location.search).get('token')||'';const rows=document.querySelector('#rows');const msg=document.querySelector('#message');async function load(){const r=await fetch('/api/admin/bookings?token='+encodeURIComponent(token));if(!r.ok){msg.textContent='Unauthorized. Add the admin token to the URL.';return}const data=await r.json();rows.innerHTML=data.length?data.map(b=>`<tr><td>${b.start.replace('T',' ')}</td><td>${b.name}<br>${b.email}<br>${b.payer_phone||''}</td><td>${b.service_name}<br>${b.location}</td><td>${b.payment_method||''}</td><td>${b.transaction_id||''}</td><td><select data-id="${b.id}"><option ${b.payment_status==='pending_verification'?'selected':''} value="pending_verification">Pending</option><option ${b.payment_status==='paid'?'selected':''} value="paid">Verified</option><option ${b.payment_status==='cancelled'?'selected':''} value="cancelled">Cancelled</option></select></td><td><a href="/api/bookings/${b.id}/calendar.ics">.ics</a></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No bookings yet.</td></tr>';rows.querySelectorAll('select').forEach(s=>s.onchange=async()=>{await fetch('/api/admin/bookings/'+s.dataset.id+'?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})})})}load();</script></body></html>
