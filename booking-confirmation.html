<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking received — Your Name</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell confirm"><p class="kicker"><b>RECEIVED</b> Payment verification</p><h1>Your session is<br><em>temporarily held.</em></h1><p class="intro">Your bKash/Rocket payment details were received. Use the controls below if you need to manage this appointment.</p><section class="confirm-card"><p id="details">Loading booking…</p><label>Booking email<input id="email" type="email" placeholder="you@company.com"></label><label>New time<input id="new-time" type="datetime-local"></label><div class="confirm-actions"><button id="reschedule" class="btn">Reschedule ↗</button><button id="cancel" class="under">Cancel booking</button></div><p id="message"></p></section><a class="under" href="/">Return home ↗</a></main><script>const id=new URLSearchParams(location.search).get('id'),details=document.querySelector('#details'),msg=document.querySelector('#message');async function load(){const r=await fetch('/api/bookings/'+id);const b=await r.json();details.textContent=`${b.service} · ${b.start.replace('T',' ')} · ${b.status}`;document.querySelector('#new-time').value=b.start}load();document.querySelector('#cancel').onclick=async()=>{const r=await fetch('/api/bookings/'+id+'/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value})});const d=await r.json();msg.textContent=d.error||'Booking cancelled.'};document.querySelector('#reschedule').onclick=async()=>{const r=await fetch('/api/bookings/'+id+'/reschedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,start:document.querySelector('#new-time').value})});const d=await r.json();msg.textContent=d.error||`Rescheduled to ${d.start.replace('T',' ')}`}</script></body></html>
